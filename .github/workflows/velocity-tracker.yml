name: Velocity Tracker

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 8 * * *' # Run daily at 8am

jobs:
  track-velocity:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Fetch full history for accurate analysis

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: |
          cd tools/velocity
          npm ci || npm install

      - name: Run Velocity Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd tools/velocity
          npm run velocity:run -- --analyze

      - name: Generate Report
        run: |
          cd tools/velocity
          npm run velocity:report

      - name: Commit & Push Log Updates
        run: |
          git config --global user.name 'Velocity Tracker Bot'
          git config --global user.email 'velocity-bot@users.noreply.github.com'
          git add tools/velocity/velocity-log.jsonl docs/velocity-forecast.md
          git commit -m "chore: update velocity metrics [skip ci]" || exit 0
          git push
